name = "honcho-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-09"
compatibility_flags = ["nodejs_compat"]

# Executes the scheduled() handler
[triggers]
crons = ["*/5 * * * *"]

[env.production]
name = "honcho-mcp"

[env.staging]
name = "honcho-mcp-staging"

[observability.logs]
enabled = true
