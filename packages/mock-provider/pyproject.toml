[project]
name = "honcho-mock-provider"
version = "0.1.0"
description = "Deterministic OpenAI-compatible provider for local Honcho development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115.0", "pydantic>=2.11.0", "uvicorn>=0.30.0"]

[project.scripts]
honcho-mock-provider = "honcho_mock_provider.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honcho_mock_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py311"
