[project]
name = "honcho-discord-connector"
version = "0.1.0"
description = "Read a Discord server's history as Honcho ingest records."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Plastic Labs", email = "hello@plasticlabs.ai" },
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/plastic-labs/honcho"
Repository = "https://github.com/plastic-labs/honcho"

[project.scripts]
honcho-discord = "honcho_discord.__main__:main"

# `honcho ingest from discord`: see honcho_cli.ingest_sources.
[project.entry-points."honcho.ingest_sources"]
discord = "honcho_discord.source:SOURCE"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honcho_discord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
