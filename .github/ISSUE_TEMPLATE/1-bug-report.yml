name: Bug report
description: Something is broken or incorrect in Honcho (API, deriver, SDK, managed offering, etc.).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search [existing issues](https://github.com/plastic-labs/honcho/issues) first.

        **Security vulnerability?** Do not use this form — report privately via [SECURITY.md](https://github.com/plastic-labs/honcho/blob/main/SECURITY.md).

        **Memory / recall quality** (wrong or noisy conclusions, weak dialectic answers) with no crash? Prefer the **Memory / recall quality** template.

  - type: dropdown
    id: deploy_mode
    attributes:
      label: Deploy mode
      description: Where are you running Honcho?
      options:
        - Managed (api.honcho.dev / app.honcho.dev)
        - Self-hosted
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the bug show up?
      options:
        - API / HTTP routes
        - Deriver / queue / message processing
        - Dreamer / consolidation
        - Dialectic / chat endpoint
        - Summarizer / session context
        - Auth / JWT / API keys
        - Embeddings / vector search
        - Python SDK
        - TypeScript SDK
        - CLI
        - Managed offering (dashboard, billing, hosted infra)
        - Docs
        - Other
    validations:
      required: true

  - type: input
    id: server_version
    attributes:
      label: Honcho server version
      description: Image tag, PyPI/git revision, or release (e.g. `v2.4.1`, `main@abc1234`, Docker digest).
      placeholder: e.g. v2.4.1
    validations:
      required: true

  - type: input
    id: sdk_version
    attributes:
      label: SDK / client version (if applicable)
      description: Python `honcho-ai` or TypeScript `@honcho-ai/sdk` version, or "n/a".
      placeholder: e.g. honcho-ai 1.2.0 / n/a
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Clear and concise description of what is wrong.
      placeholder: When I…, Honcho…
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a short script/API sequence. Redact secrets, JWTs, and production user content.
      placeholder: |
        1. Create a session with …
        2. POST /v3/... with body …
        3. Observe …
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (error messages, status codes, incorrect data).
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options:
        - "No"
        - "Yes — it worked in an earlier version"
        - Unsure
    validations:
      required: true

  - type: input
    id: last_good_version
    attributes:
      label: Last known good version (if regression)
      placeholder: e.g. v2.3.0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Relevant API or deriver logs, stack traces, or screenshots. Redact secrets and user content.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Config knobs (provider, deriver/dream settings), deployment notes, related issues/PRs.
    validations:
      required: false
