name: Hermes Plugin Tests

on:
  push:
    branches: [main]
    paths:
      - 'hermes-plugin-honcho/**'
      - '.github/workflows/hermes-plugin-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hermes-plugin-honcho/**'
      - '.github/workflows/hermes-plugin-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests are their own uv project (not a workspace member), apart from the plugin's
    # pyproject.toml: they need a pinned Hermes install for the core modules the plugin
    # imports, and no Honcho server.
    defaults:
      run:
        working-directory: hermes-plugin-honcho/tests
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-dependency-glob: "hermes-plugin-honcho/tests/uv.lock"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "hermes-plugin-honcho/tests/.python-version"

      - name: Install the test environment
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
