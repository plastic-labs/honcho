# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'honcho'
primary_region = 'ewr'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[processes]
  api = 'fastapi run src/main.py'
  deriver = 'python -m scripts.deriver_supervisor'

[[restart]]
  # The supervisor exits nonzero after bounded health-probe failures.  Keep this
  # always-on worker eligible for restart even if a child exits cleanly by mistake.
  policy = 'always'
  processes = ['deriver']

[http_service]
  internal_port = 8000
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 3
  processes = ['api']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['api', 'deriver']

[[metrics]]
  port = 8000
  path = "/metrics"
  processes = ["api"]

[[metrics]]
  port = 9090
  path = "/metrics"
  processes = ["deriver"]
