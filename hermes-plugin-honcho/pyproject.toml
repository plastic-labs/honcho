[project]
name = "hermes-plugin-honcho"
version = "1.1.0"
description = "Hermes Agent memory provider plugin: honcho"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update` (hermes-agent#113851). Keep upper bounds: Hermes pins its own deps exactly
# and refuses a plugin whose requirements cannot resolve against them.
dependencies = [
    "honcho-ai>=2.2.0,<3",
    "httpx>=0.27,<1",
]

# No dependency groups or extras here: Hermes locks this file as a member of a uv workspace whose
# root project is hermes-agent, and uv parses every member's groups while locking, so a test pin on
# hermes-agent fails every install and update (#1485). The test environment is tests/pyproject.toml.

[tool.uv]
package = false
