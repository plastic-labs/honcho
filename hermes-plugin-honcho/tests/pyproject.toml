# The unit-test environment: `uv run pytest` from this directory runs the suite against a pinned
# Hermes, whose core modules (agent.*, hermes_cli.*, tools.*) the plugin imports. It is its own
# project so the plugin's pyproject.toml, which Hermes locks, never names hermes-agent (#1485).
[project]
name = "hermes-plugin-honcho-tests"
version = "0.0.0"
# 3.14, as Hermes runs: its core dependencies are declared for python_version >= '3.14' only, so on
# an older Python the pinned Hermes installs without them (ruamel.yaml, fastapi, ...).
requires-python = ">=3.14,<3.15"
dependencies = [
    "hermes-plugin-honcho",
    "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@c22f5f8483e50a833f2b2e76f7852364adc9d2e2",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[tool.uv]
package = false
# Hermes' setup.py refuses wheel builds outside its Nix derivation (`HERMES_NIX_BUILD=1`) because
# shell installs are editable; a pinned git build for tests is the same sealed-wheel case.
extra-build-variables = { hermes-agent = { HERMES_NIX_BUILD = "1" } }
# Hermes' own [tool.uv] override: browser-harness pins pillow==12.3.0 against Hermes' Pillow 13.
# Overrides don't carry over to projects that depend on Hermes, so this repeats it.
override-dependencies = ["Pillow==13.0.0"]

[tool.uv.sources]
# Virtual: installs the plugin's [project].dependencies without building the plugin itself.
hermes-plugin-honcho = { path = "..", package = false }
